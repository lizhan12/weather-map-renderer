<!DOCTYPE html>
<html lang="zh-ch">
<head>
  <meta charset="UTF-8">
  <title>接口文档</title>
  <style>
  .con{
  width:700px;
  margin:0 auto;
  }
  .con h5{
     font-size:18px;
    padding:5px;
    margin:2px;

  }
  table{
    text-align:center;
     border-collapse: collapse;
  }
  td,th{
       border: 1px solid #333;
       padding:5px;


  }
  </style>
</head>
<body>
<div class="con">
  <table>
    <h5>接口：/api/pic/code/datestr/type/el</h5>
    <h5>例子：/api/pic/330100/20230711190000/tem/TEM_MAX_1H</h5>
    <tr>
      <th>名称</th>
      <th>字段</th>
    </tr>
    <tr>
      <td>code</td>
      <td>区号：6位</td>
    </tr>

    <tr>
      <td>datestr</td>
      <td>时间:14位</td>
    </tr>
    <tr>
      <td>type</td>
      <td>类型：tem,wind,rain</td>
    </tr>
    <tr>
      <td>el</td>
      <td>要素:自动站要素</td>
    </tr>
  </table>
</div>
</body>
</html>
