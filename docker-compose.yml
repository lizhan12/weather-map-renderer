services:
  py_draw:
    build: .
    container_name: py_draw
    restart: always
    ports:
      - "8001:8001"
    volumes:
      - py_draw_data:/home/lizhan/tu
    env_file:
      - .env
    mem_limit: 2g
    mem_reservation: 256m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/docs')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  py_draw_data:
